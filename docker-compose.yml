services:
  t3code:
    build:
      context: .
      args:
        T3_VERSION: ${T3_VERSION:-0.0.31}
    image: ${T3_IMAGE:-local/t3code:latest}
    container_name: t3code
    restart: unless-stopped
    expose:
      - "3773"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      T3CODE_CONFIG_PATH: /config/t3code.toml
      T3CODE_HOME: /data/t3
      GROK_CONFIG_DIR: ${GROK_CONFIG_DIR:-/data/home/.grok}
      T3_SERVER_HOST: ${T3_SERVER_HOST:-0.0.0.0}
      T3_SERVER_PORT: ${T3_SERVER_PORT:-3773}
      T3_AUTH_PROXY: ${T3_AUTH_PROXY:-0}
      T3_AUTH_PROXY_INTERNAL_HOST: ${T3_AUTH_PROXY_INTERNAL_HOST:-127.0.0.1}
      T3_AUTH_PROXY_INTERNAL_PORT: ${T3_AUTH_PROXY_INTERNAL_PORT:-13773}
      T3_AUTH_PROXY_ADMIN_TTL: ${T3_AUTH_PROXY_ADMIN_TTL:-2m}
      T3_WORKDIR: ${T3_WORKDIR:-/workspace}
      T3_GIT_REPOSITORY_SCAN_DEPTH: ${T3_GIT_REPOSITORY_SCAN_DEPTH:-8}
      OPENCODE_CONFIG_DIR: ${OPENCODE_CONFIG_DIR:-/data/home/.config/opencode}
      T3_AUTO_UPDATE: ${T3_AUTO_UPDATE:-1}
      T3_UPDATE_CODEX: ${T3_UPDATE_CODEX:-0}
      T3_UPDATE_CLAUDE: ${T3_UPDATE_CLAUDE:-0}
      T3_UPDATE_CURSOR: ${T3_UPDATE_CURSOR:-0}
      T3_UPDATE_GROK: ${T3_UPDATE_GROK:-0}
      T3_UPDATE_OPENCODE: ${T3_UPDATE_OPENCODE:-0}
      T3_INSTALL_DISABLED_PROVIDERS: ${T3_INSTALL_DISABLED_PROVIDERS:-0}
      T3_ENABLE_PROVIDER_UPDATE_CHECKS: ${T3_ENABLE_PROVIDER_UPDATE_CHECKS:-0}
      T3_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: ${T3_AUTO_BOOTSTRAP_PROJECT_FROM_CWD:-1}
      T3_DEFAULT_THREAD_ENV_MODE: ${T3_DEFAULT_THREAD_ENV_MODE:-local}
      T3_NEW_WORKTREES_START_FROM_ORIGIN: ${T3_NEW_WORKTREES_START_FROM_ORIGIN:-0}
      T3_PROVIDER_MODEL_PREFERENCES_JSON: ${T3_PROVIDER_MODEL_PREFERENCES_JSON:-}
      T3_PROVIDER_CODEX: ${T3_PROVIDER_CODEX:-1}
      T3_PROVIDER_CLAUDE: ${T3_PROVIDER_CLAUDE:-1}
      T3_PROVIDER_CURSOR: ${T3_PROVIDER_CURSOR:-1}
      T3_PROVIDER_GROK: ${T3_PROVIDER_GROK:-1}
      T3_PROVIDER_OPENCODE: ${T3_PROVIDER_OPENCODE:-1}
      T3_CODEX_DISPLAY_NAME: ${T3_CODEX_DISPLAY_NAME:-Codex}
      T3_CODEX_BINARY_PATH: ${T3_CODEX_BINARY_PATH:-codex}
      T3_CODEX_HOME_PATH: ${T3_CODEX_HOME_PATH:-/data/codex}
      T3_CODEX_SHADOW_HOME_PATH: ${T3_CODEX_SHADOW_HOME_PATH:-}
      T3_CODEX_CONFIG_DIR_SOURCE: ${T3_CODEX_CONFIG_DIR_SOURCE:-}
      T3_CODEX_CUSTOM_MODELS: ${T3_CODEX_CUSTOM_MODELS:-}
      T3_CODEX_HIDDEN_MODELS: ${T3_CODEX_HIDDEN_MODELS:-}
      T3_CODEX_MODEL_ORDER: ${T3_CODEX_MODEL_ORDER:-}
      T3_CODEX_ENV_JSON: ${T3_CODEX_ENV_JSON:-}
      T3_CLAUDE_DISPLAY_NAME: ${T3_CLAUDE_DISPLAY_NAME:-Claude}
      T3_CLAUDE_BINARY_PATH: ${T3_CLAUDE_BINARY_PATH:-claude}
      T3_CLAUDE_HOME_PATH: ${T3_CLAUDE_HOME_PATH:-/data/claude-home}
      T3_CLAUDE_CONFIG_DIR_SOURCE: ${T3_CLAUDE_CONFIG_DIR_SOURCE:-}
      T3_CLAUDE_LAUNCH_ARGS: ${T3_CLAUDE_LAUNCH_ARGS:-}
      T3_CLAUDE_CUSTOM_MODELS: ${T3_CLAUDE_CUSTOM_MODELS:-}
      T3_CLAUDE_HIDDEN_MODELS: ${T3_CLAUDE_HIDDEN_MODELS:-}
      T3_CLAUDE_MODEL_ORDER: ${T3_CLAUDE_MODEL_ORDER:-}
      T3_CLAUDE_ENV_JSON: ${T3_CLAUDE_ENV_JSON:-}
      T3_CURSOR_DISPLAY_NAME: ${T3_CURSOR_DISPLAY_NAME:-Cursor}
      T3_CURSOR_BINARY_PATH: ${T3_CURSOR_BINARY_PATH:-t3-cursor-agent}
      T3_CURSOR_REAL_BINARY_PATH: ${T3_CURSOR_REAL_BINARY_PATH:-agent}
      T3_CURSOR_API_ENDPOINT: ${T3_CURSOR_API_ENDPOINT:-}
      T3_CURSOR_CUSTOM_MODELS: ${T3_CURSOR_CUSTOM_MODELS:-}
      T3_CURSOR_HIDDEN_MODELS: ${T3_CURSOR_HIDDEN_MODELS:-}
      T3_CURSOR_MODEL_ORDER: ${T3_CURSOR_MODEL_ORDER:-}
      T3_CURSOR_ENV_JSON: ${T3_CURSOR_ENV_JSON:-}
      T3_GROK_DISPLAY_NAME: ${T3_GROK_DISPLAY_NAME:-Grok}
      T3_GROK_BINARY_PATH: ${T3_GROK_BINARY_PATH:-grok}
      T3_GROK_CONFIG_DIR_SOURCE: ${T3_GROK_CONFIG_DIR_SOURCE:-}
      T3_GROK_CUSTOM_MODELS: ${T3_GROK_CUSTOM_MODELS:-}
      T3_GROK_HIDDEN_MODELS: ${T3_GROK_HIDDEN_MODELS:-}
      T3_GROK_MODEL_ORDER: ${T3_GROK_MODEL_ORDER:-}
      T3_GROK_ENV_JSON: ${T3_GROK_ENV_JSON:-}
      T3_OPENCODE_DISPLAY_NAME: ${T3_OPENCODE_DISPLAY_NAME:-OpenCode}
      T3_OPENCODE_BINARY_PATH: ${T3_OPENCODE_BINARY_PATH:-opencode}
      T3_OPENCODE_DEFAULT_MODEL: ${T3_OPENCODE_DEFAULT_MODEL:-openai/gpt-5}
      T3_OPENCODE_MANAGED_SERVER: ${T3_OPENCODE_MANAGED_SERVER:-0}
      T3_OPENCODE_MANAGED_HOST: ${T3_OPENCODE_MANAGED_HOST:-127.0.0.1}
      T3_OPENCODE_MANAGED_PORT: ${T3_OPENCODE_MANAGED_PORT:-4096}
      T3_OPENCODE_CONFIG_DIR_SOURCE: ${T3_OPENCODE_CONFIG_DIR_SOURCE:-}
      T3_OPENCODE_CONFIG_SOURCE: ${T3_OPENCODE_CONFIG_SOURCE:-}
      T3_OPENCODE_CONFIG_PATH: ${T3_OPENCODE_CONFIG_PATH:-}
      T3_OPENCODE_CONFIG_CONTENT: ${T3_OPENCODE_CONFIG_CONTENT:-}
      T3_OPENCODE_CONFIG_SYNC_MODE: ${T3_OPENCODE_CONFIG_SYNC_MODE:-preserve-mcp}
      T3_OPENCODE_SERVER_URL: ${T3_OPENCODE_SERVER_URL:-}
      T3_OPENCODE_SERVER_PASSWORD: ${T3_OPENCODE_SERVER_PASSWORD:-}
      T3_OPENCODE_CUSTOM_MODELS: ${T3_OPENCODE_CUSTOM_MODELS:-}
      T3_OPENCODE_HIDDEN_MODELS: ${T3_OPENCODE_HIDDEN_MODELS:-}
      T3_OPENCODE_MODEL_ORDER: ${T3_OPENCODE_MODEL_ORDER:-}
      T3_OPENCODE_ENV_JSON: ${T3_OPENCODE_ENV_JSON:-}
      T3_OPENCODE_CLOUDFLARE_MCP: ${T3_OPENCODE_CLOUDFLARE_MCP:-1}
      T3_OPENCODE_CLOUDFLARE_AUTH: ${T3_OPENCODE_CLOUDFLARE_AUTH:-auto}
      T3_OPENCODE_MCP_PRESETS: ${T3_OPENCODE_MCP_PRESETS:-context7,github}
      T3_OPENCODE_MCP_SERVERS_JSON: ${T3_OPENCODE_MCP_SERVERS_JSON:-}
      T3_OPENCODE_MCP_SERVERS_FILE: ${T3_OPENCODE_MCP_SERVERS_FILE:-}
      T3_HARNESS_SANDBOX_INSTRUCTIONS: ${T3_HARNESS_SANDBOX_INSTRUCTIONS:-1}
      T3_OPENCODE_SANDBOX_INSTRUCTIONS: ${T3_OPENCODE_SANDBOX_INSTRUCTIONS:-1}
      T3_OPENCODE_SANDBOX_ONLY: ${T3_OPENCODE_SANDBOX_ONLY:-0}
      T3_SANDBOX_URL: ${T3_SANDBOX_URL:-}
      T3_SANDBOX_TOKEN: ${T3_SANDBOX_TOKEN:-}
      T3_SANDBOX_TOKEN_FILE: ${T3_SANDBOX_TOKEN_FILE:-}
      T3_SANDBOX_MCP_RECONCILE: ${T3_SANDBOX_MCP_RECONCILE:-1}
      T3_XCODE_SSH_HOST: ${T3_XCODE_SSH_HOST:-}
      T3_XCODE_SSH_PORT: ${T3_XCODE_SSH_PORT:-22}
      T3_XCODE_SSH_IDENTITY_FILE: ${T3_XCODE_SSH_IDENTITY_FILE:-}
      T3_XCODE_SSH_KNOWN_HOSTS: ${T3_XCODE_SSH_KNOWN_HOSTS:-}
      T3_XCODE_SSH_OPTIONS_JSON: ${T3_XCODE_SSH_OPTIONS_JSON:-}
      T3_XCODE_LOCAL_WORKSPACE_ROOT: ${T3_XCODE_LOCAL_WORKSPACE_ROOT:-/workspace}
      T3_XCODE_REMOTE_WORKSPACE_ROOT: ${T3_XCODE_REMOTE_WORKSPACE_ROOT:-}
      T3_XCODE_DERIVED_DATA_ROOT: ${T3_XCODE_DERIVED_DATA_ROOT:-}
      T3_XCODE_ENABLED_WORKFLOWS: ${T3_XCODE_ENABLED_WORKFLOWS:-}
      LUMO_API_KEY: ${LUMO_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROK_DEPLOYMENT_KEY: ${GROK_DEPLOYMENT_KEY:-}
      GROK_PROXY_URL: ${GROK_PROXY_URL:-}
      GROK_CHANNEL: ${GROK_CHANNEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SENTRY_ACCESS_TOKEN: ${SENTRY_ACCESS_TOKEN:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      GH_HOST: ${GH_HOST:-github.com}
      GH_GIT_PROTOCOL: ${GH_GIT_PROTOCOL:-ssh}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - type: bind
        source: ${T3_CONFIG_DIR:-./config}
        target: /config
        read_only: true
      - type: bind
        source: ${T3_WORKSPACE_HOST:-./workspace}
        target: /workspace
      - type: bind
        source: ${T3_STATE_HOST:-./data/t3}
        target: /data/t3
      - type: bind
        source: ${T3_HOME_HOST:-./data/home}
        target: /data/home
      - type: bind
        source: ${T3_CODEX_HOME_HOST:-./data/codex}
        target: /data/codex
      - type: bind
        source: ${T3_CLAUDE_HOME_HOST:-./data/claude-home}
        target: /data/claude-home
      - type: volume
        source: t3code-npm-global
        target: /data/npm-global
      - type: volume
        source: t3code-npm-cache
        target: /data/npm-cache
    networks:
      - t3-platform
    tty: true
    stdin_open: true

  issue-worker:
    profiles: ["issue-worker"]
    build:
      context: .
    image: ${T3_IMAGE:-local/t3code:latest}
    container_name: t3-issue-worker
    user: "${T3_UID:-1000}:${T3_GID:-1000}"
    group_add:
      - "${T3_WORKSPACE_GID:-1000}"
    entrypoint: ["/usr/bin/dumb-init", "--", "/opt/t3-docker/issue-worker-entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /data/issue-worker/home
      XDG_CONFIG_HOME: /data/issue-worker/home/.config
      XDG_DATA_HOME: /data/issue-worker/home/.local/share
      XDG_CACHE_HOME: /data/issue-worker/home/.cache
      OPENCODE_CONFIG_DIR: /data/issue-worker/home/.config/opencode
      NPM_CONFIG_PREFIX: /data/issue-worker/npm-global
      NPM_CONFIG_CACHE: /data/issue-worker/npm-cache
      T3_ISSUE_WORKER_NPM_PREFIX: /data/issue-worker/npm-global
      T3_ISSUE_WORKER_NPM_CACHE: /data/issue-worker/npm-cache
      T3_ISSUE_WORKER_GITHUB_TOKEN: ${T3_ISSUE_WORKER_GITHUB_TOKEN:-}
      T3_ISSUE_WORKER_GITHUB_API_URL: ${T3_ISSUE_WORKER_GITHUB_API_URL:-https://api.github.com}
      T3_ISSUE_WORKER_GITHUB_API_VERSION: ${T3_ISSUE_WORKER_GITHUB_API_VERSION:-2026-03-10}
      T3_ISSUE_WORKER_GITHUB_SERVER_URL: ${T3_ISSUE_WORKER_GITHUB_SERVER_URL:-https://github.com}
      T3_ISSUE_WORKER_REPOSITORIES: ${T3_ISSUE_WORKER_REPOSITORIES:-}
      T3_ISSUE_WORKER_ALLOWED_ACTORS: ${T3_ISSUE_WORKER_ALLOWED_ACTORS:-}
      T3_ISSUE_WORKER_MODEL: ${T3_ISSUE_WORKER_MODEL:-proton/lumo-max}
      T3_ISSUE_WORKER_AGENT: ${T3_ISSUE_WORKER_AGENT:-github-issue-worker}
      T3_ISSUE_WORKER_PROMPT_SUFFIX: ${T3_ISSUE_WORKER_PROMPT_SUFFIX:-}
      T3_ISSUE_WORKER_BRANCH_PREFIX: ${T3_ISSUE_WORKER_BRANCH_PREFIX:-t3-agent}
      T3_ISSUE_WORKER_GIT_NAME: ${T3_ISSUE_WORKER_GIT_NAME:-t3-issue-worker[bot]}
      T3_ISSUE_WORKER_GIT_EMAIL: ${T3_ISSUE_WORKER_GIT_EMAIL:-t3-issue-worker[bot]@users.noreply.github.com}
      T3_ISSUE_WORKER_POLL_SECONDS: ${T3_ISSUE_WORKER_POLL_SECONDS:-60}
      T3_ISSUE_WORKER_TIMEOUT_SECONDS: ${T3_ISSUE_WORKER_TIMEOUT_SECONDS:-7200}
      T3_ISSUE_WORKER_MAX_CONCURRENT: ${T3_ISSUE_WORKER_MAX_CONCURRENT:-1}
      T3_ISSUE_WORKER_MAX_PER_POLL: ${T3_ISSUE_WORKER_MAX_PER_POLL:-3}
      T3_ISSUE_WORKER_MAX_POLL_FAILURES: ${T3_ISSUE_WORKER_MAX_POLL_FAILURES:-10}
      T3_ISSUE_WORKER_MAX_LOG_BYTES: ${T3_ISSUE_WORKER_MAX_LOG_BYTES:-52428800}
      T3_ISSUE_WORKER_BOOTSTRAP_LABELS: ${T3_ISSUE_WORKER_BOOTSTRAP_LABELS:-1}
      T3_ISSUE_WORKER_KEEP_FAILED_DAYS: ${T3_ISSUE_WORKER_KEEP_FAILED_DAYS:-14}
      T3_ISSUE_WORKER_ALLOW_CI_CHANGES: ${T3_ISSUE_WORKER_ALLOW_CI_CHANGES:-0}
      T3_ISSUE_WORKER_LABEL_READY: ${T3_ISSUE_WORKER_LABEL_READY:-agent-ready}
      T3_ISSUE_WORKER_LABEL_RUNNING: ${T3_ISSUE_WORKER_LABEL_RUNNING:-agent-running}
      T3_ISSUE_WORKER_LABEL_PR: ${T3_ISSUE_WORKER_LABEL_PR:-agent-pr-opened}
      T3_ISSUE_WORKER_LABEL_COMPLETE: ${T3_ISSUE_WORKER_LABEL_COMPLETE:-agent-complete}
      T3_ISSUE_WORKER_LABEL_NEEDS_HUMAN: ${T3_ISSUE_WORKER_LABEL_NEEDS_HUMAN:-agent-needs-human}
      T3_ISSUE_WORKER_OPENCODE_CONFIG_SOURCE: /config/opencode
      T3_ISSUE_WORKER_DATA_ROOT: /data/issue-worker
      T3_ISSUE_WORKER_WORKSPACE_ROOT: /workspace
      T3_SANDBOX_URL: ${T3_SANDBOX_URL:-}
      T3_SANDBOX_TOKEN: ${T3_SANDBOX_TOKEN:-}
      T3_SANDBOX_LOCK_WORKSPACE: "1"
      T3_SANDBOX_MCP_RECONCILE: "1"
      T3_OPENCODE_SANDBOX_ONLY: "1"
      T3_XCODE_SSH_HOST: ${T3_XCODE_SSH_HOST:-}
      T3_XCODE_SSH_PORT: ${T3_XCODE_SSH_PORT:-22}
      T3_XCODE_SSH_IDENTITY_FILE: /run/t3-xcode-ssh/t3-xcode
      T3_XCODE_SSH_KNOWN_HOSTS: /run/t3-xcode-ssh/known_hosts
      T3_XCODE_SSH_OPTIONS_JSON: ${T3_XCODE_SSH_OPTIONS_JSON:-}
      T3_XCODE_LOCAL_WORKSPACE_ROOT: /workspace
      T3_XCODE_REMOTE_WORKSPACE_ROOT: ${T3_XCODE_REMOTE_WORKSPACE_ROOT:-}
      T3_XCODE_DERIVED_DATA_ROOT: ${T3_XCODE_DERIVED_DATA_ROOT:-}
      T3_XCODE_ENABLED_WORKFLOWS: ${T3_XCODE_ENABLED_WORKFLOWS:-}
      LUMO_API_KEY: ${LUMO_API_KEY:-}
    volumes:
      - ./config:/config:ro
      - ./data/issue-worker:/data/issue-worker
      - ./data/home/.ssh:/run/t3-xcode-ssh:ro
      - ./workspace:/workspace
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - t3-platform
    healthcheck:
      test: ["CMD", "node", "/opt/t3-docker/github-issue-worker.mjs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  t3-platform:
    name: ${T3_PLATFORM_NETWORK:-t3-agent-platform}

volumes:
  t3code-npm-global:
  t3code-npm-cache:

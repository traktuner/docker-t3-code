[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = @@MAX_TTL_SECONDS@@

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = @@EXECD_IMAGE@@

[storage]
allowed_host_paths = [@@HOST_WORKSPACE_ROOT@@]
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/data/opensandbox.sqlite3"

[docker]
network_mode = @@RUNTIME_NETWORK@@
@@DOCKER_HOST_IP_CONFIG@@
port_range_min = @@PORT_RANGE_MIN@@
port_range_max = @@PORT_RANGE_MAX@@
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = @@APPARMOR_PROFILE@@
pids_limit = @@PIDS_LIMIT@@
seccomp_profile = @@SECCOMP_PROFILE@@

[ingress]
mode = "direct"

[egress]
image = @@EGRESS_IMAGE@@
mode = @@EGRESS_MODE@@
disable_ipv6 = true

@@SECURE_RUNTIME_CONFIG@@

[renew_intent]
enabled = false

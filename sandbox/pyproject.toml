[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t3-sandbox-gateway"
version = "0.1.0"
description = "Policy gateway between coding harnesses and OpenSandbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0",
  "json5==0.15.0",
  "opensandbox==0.1.13",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
